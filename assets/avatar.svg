<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 撞色 ① 荧光绿 → 绮堇紫 -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39FF6A"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <!-- 撞色 ② 璎珞紫 → 素澜青 -->
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#4CC9D8"/>
    </linearGradient>
    <!-- 撞色 ③ 雾霭蓝 → 柔柠黄 -->
    <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
    <!-- 撞色 ④ 薄荷绿 → 宝蓝色 -->
    <linearGradient id="g4" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#63F2B7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 外环 -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#4CC9D8" stroke-width="1" opacity="0.3" stroke-dasharray="3 12"/>
  <!-- 无限符号：左右两个环 -->
  <g filter="url(#glow)">
    <!-- 左环：荧光绿→绮堇紫 -->
    <path d="M256 256
             C 226 196, 166 160, 128 178
             C 92 195, 92 258, 128 292
             C 166 326, 226 316, 256 256 Z"
          fill="none" stroke="url(#g1)" stroke-width="30" stroke-linecap="round"/>
    <!-- 右环：璎珞紫→素澜青 -->
    <path d="M256 256
             C 286 196, 346 160, 384 178
             C 420 195, 420 258, 384 292
             C 346 326, 286 316, 256 256 Z"
          fill="none" stroke="url(#g2)" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- 四颗轨道星，各用一套撞色 -->
  <g filter="url(#glow)">
    <circle cx="128" cy="120" r="10" fill="url(#g1)"/>
    <circle cx="392" cy="160" r="8"  fill="url(#g2)"/>
    <circle cx="384" cy="392" r="9"  fill="url(#g3)"/>
    <circle cx="132" cy="392" r="8"  fill="url(#g4)"/>
  </g>
  <!-- 中心交点 -->
  <circle cx="256" cy="256" r="7" fill="#fff" opacity="0.95"/>
</svg>
